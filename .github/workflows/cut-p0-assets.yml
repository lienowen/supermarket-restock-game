name: Cut P0 Assets

on:
  push:
    branches: [agent/fix-p0-level-one]
    paths:
      - '.github/workflows/cut-p0-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source assets
        uses: actions/checkout@v4
        with:
          ref: agent/fix-p0-level-one

      - name: Cut transparent upload assets
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import json

          out = Path('p0-cut-assets')
          out.mkdir(exist_ok=True)

          def clean_neutral(img):
              img = img.convert('RGBA')
              px = img.load()
              for y in range(img.height):
                  for x in range(img.width):
                      r, g, b, a = px[x, y]
                      if a <= 8:
                          continue
                      if max(r, g, b) - min(r, g, b) <= 30 and (r + g + b) / 3 >= 176:
                          px[x, y] = (r, g, b, 0)
              return img

          def trim(img, padding=10):
              alpha = img.getchannel('A')
              box = alpha.getbbox()
              if not box:
                  return img
              l, t, r, b = box
              return img.crop((max(0, l-padding), max(0, t-padding), min(img.width, r+padding), min(img.height, b+padding)))

          cart_src = Image.open('public/assets/game/production-v1/props/equipment-restock-cart-empty.png')
          cart = trim(clean_neutral(cart_src), 10)
          cart_path = out / 'equipment-restock-cart-empty-cut.png'
          cart.save(cart_path, optimize=True)

          front = Image.new('RGBA', cart.size, (0, 0, 0, 0))
          start_y = round(cart.height * 0.57)
          front.alpha_composite(cart.crop((0, start_y, cart.width, cart.height)), (0, start_y))
          front_path = out / 'equipment-restock-cart-front-overlay.png'
          front.save(front_path, optimize=True)

          case_src = Image.open('public/assets/game/production-v2/cooler-restock/cola_case_open_hd.png').convert('RGBA')
          alpha_box = case_src.getchannel('A').getbbox() or (0, 0, case_src.width, case_src.height)
          l, t, r, b = alpha_box
          retained_h = max(1, round((b - t) * 0.58))
          case = case_src.crop((max(0, l-8), max(0, t-8), min(case_src.width, r+8), min(case_src.height, t+retained_h+8)))
          case = trim(case, 6)
          case_path = out / 'prop-cola-case-open-cut.png'
          case.save(case_path, optimize=True)

          # Preview only: demonstrates the intended layer order.
          canvas = Image.new('RGBA', (720, 520), (0, 0, 0, 0))
          cart_w = 520
          cart_h = round(cart.height * cart_w / cart.width)
          cart_r = cart.resize((cart_w, cart_h), Image.Resampling.LANCZOS)
          front_r = front.resize((cart_w, cart_h), Image.Resampling.LANCZOS)
          cart_x = (canvas.width - cart_w) // 2
          cart_y = canvas.height - cart_h - 18

          case_w = 185
          case_h = round(case.height * case_w / case.width)
          case_r = case.resize((case_w, case_h), Image.Resampling.LANCZOS).rotate(-2, expand=True, resample=Image.Resampling.BICUBIC)
          case_x = cart_x + round(cart_w * 0.49) - case_r.width // 2
          case_y = cart_y + round(cart_h * 0.25)

          shadow = Image.new('RGBA', canvas.size, (0, 0, 0, 0))
          sd = ImageDraw.Draw(shadow)
          sd.ellipse((case_x+18, case_y+case_r.height-28, case_x+case_r.width-12, case_y+case_r.height+8), fill=(0, 0, 0, 90))
          shadow = shadow.filter(ImageFilter.GaussianBlur(8))
          canvas.alpha_composite(shadow)
          canvas.alpha_composite(cart_r, (cart_x, cart_y))
          canvas.alpha_composite(case_r, (case_x, case_y))
          canvas.alpha_composite(front_r, (cart_x, cart_y))
          preview_path = out / 'preview-cart-open-case.png'
          canvas.save(preview_path, optimize=True)

          metadata = {
              'files': {
                  cart_path.name: {'size': cart.size, 'use': 'cart back/body layer'},
                  front_path.name: {'size': front.size, 'use': 'same-size foreground occlusion layer', 'startRatio': 0.57},
                  case_path.name: {'size': case.size, 'use': 'open cola case layer'},
                  preview_path.name: {'size': canvas.size, 'use': 'reference preview only'}
              },
              'layerOrder': ['equipment-restock-cart-empty-cut.png', 'prop-cola-case-open-cut.png', 'equipment-restock-cart-front-overlay.png'],
              'notes': ['All PNG files use transparent backgrounds.', 'Keep cart body and front overlay at identical position and display size.']
          }
          (out / 'placement.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Upload cut assets
        uses: actions/upload-artifact@v4
        with:
          name: p0-cut-assets
          path: p0-cut-assets
          if-no-files-found: error
          retention-days: 7
