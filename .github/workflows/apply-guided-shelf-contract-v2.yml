name: Apply guided shelf contract v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-guided-shelf-contract-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guided shelf contract
        run: python3 scripts/apply-guided-shelf-contract.py

      - name: Validate source and production build
        run: |
          npm ci
          npm test
          npm run build
          node --check scripts/capture-release-regressions.mjs

      - name: Commit validated contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/presentation/scenes/StarterMarketScene.ts scripts/capture-release-regressions.mjs .github/workflows/ui-audit.yml
          git rm .github/workflows/apply-guided-shelf-contract.yml
          git rm .github/workflows/apply-guided-shelf-contract-v2.yml
          git rm scripts/apply-guided-shelf-contract.py
          git commit -m "Align guided shelf visuals and regression contract"
          git push origin HEAD:main

# retry after boundary contract update
