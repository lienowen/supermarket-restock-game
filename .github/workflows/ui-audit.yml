name: UI Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish pending UI regression status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "pending",
              context: "UI Regression Audit",
              description: "Running mature Level 2-7 gameplay gates",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify release bundle
        run: |
          set -o pipefail
          npm run verify:release 2>&1 | tee release-check.log

      - name: Measure initial release payload
        run: |
          set -o pipefail
          node scripts/measure-release-payload.mjs 2>&1 | tee release-payload.log

      - name: Legacy Level 1-10 diagnostics
        id: legacy
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-release-regressions.mjs 2>&1 | tee ui-audit-run.log

      - name: Level briefing diagnostics
        id: briefing
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-level-briefings.mjs 2>&1 | tee level-briefing-audit.log

      - name: Level 1 guided drag diagnostics
        id: guided
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-guided-delivery.mjs 2>&1 | tee guided-delivery-audit.log

      - name: Level 2 mature memory gate
        id: memory
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-promotion-memory.mjs 2>&1 | tee promotion-memory-audit.log

      - name: Level 3 mature checkout gate
        id: checkout
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-mature-checkout.mjs 2>&1 | tee mature-checkout-audit.log

      - name: Level 4 mature scrub gate
        id: clean
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-mature-clean.mjs 2>&1 | tee mature-clean-audit.log

      - name: Level 5 golden order-hunt gate
        id: order
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-golden-order-hunt.mjs 2>&1 | tee golden-order-hunt-audit.log

      - name: Level 6 mature capacity gate
        id: capacity
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-cart-capacity.mjs 2>&1 | tee cart-capacity-audit.log

      - name: Level 7 mature patience gate
        id: patience
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/capture-checkout-patience.mjs 2>&1 | tee checkout-patience-audit.log

      - name: Upload CrazyGames release package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazygames-release
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: |
            ui-audit
            ui-audit-run.log
            level-briefing-audit.log
            guided-delivery-audit.log
            promotion-memory-audit.log
            mature-checkout-audit.log
            mature-clean-audit.log
            golden-order-hunt-audit.log
            cart-capacity-audit.log
            checkout-patience-audit.log
            build.log
            release-check.log
            release-payload.log
            release-payload-report.json
          if-no-files-found: warn

      - name: Publish UI regression status
        if: always()
        uses: actions/github-script@v7
        env:
          MEMORY: ${{ steps.memory.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
          ORDER: ${{ steps.order.outcome }}
          CAPACITY: ${{ steps.capacity.outcome }}
          PATIENCE: ${{ steps.patience.outcome }}
        with:
          script: |
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;
            const outcomes = {
              L2: process.env.MEMORY,
              L3: process.env.CHECKOUT,
              L4: process.env.CLEAN,
              L5: process.env.ORDER,
              L6: process.env.CAPACITY,
              L7: process.env.PATIENCE
            };
            const failed = Object.entries(outcomes)
              .filter(([, value]) => value !== "success")
              .map(([level]) => level);
            const passed = failed.length === 0;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? "success" : "failure",
              context: "UI Regression Audit",
              description: passed
                ? "Mature Level 2-7 gameplay gates passed"
                : `Mature gates failed: ${failed.join(", ")}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Enforce mature Level 2-7 gates
        if: always()
        run: |
          test "${{ steps.memory.outcome }}" = "success"
          test "${{ steps.checkout.outcome }}" = "success"
          test "${{ steps.clean.outcome }}" = "success"
          test "${{ steps.order.outcome }}" = "success"
          test "${{ steps.capacity.outcome }}" = "success"
          test "${{ steps.patience.outcome }}" = "success"
