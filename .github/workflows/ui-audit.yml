name: UI Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish pending UI regression status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "pending",
              context: "UI Regression Audit",
              description: "Testing campaign, briefings, guided controls, memory and checkout gameplay",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Verify release bundle
        run: |
          set -o pipefail
          npm run verify:release 2>&1 | tee release-check.log

      - name: Measure initial release payload
        run: |
          set -o pipefail
          node scripts/measure-release-payload.mjs 2>&1 | tee release-payload.log

      - name: Capture release regressions
        run: |
          set -o pipefail
          node scripts/capture-release-regressions.mjs 2>&1 | tee ui-audit-run.log

      - name: Capture level briefing UI
        run: |
          set -o pipefail
          node scripts/capture-level-briefings.mjs 2>&1 | tee level-briefing-audit.log

      - name: Verify guided delivery drag
        run: |
          set -o pipefail
          node scripts/capture-guided-delivery.mjs 2>&1 | tee guided-delivery-audit.log

      - name: Verify promotion memory challenge
        run: |
          set -o pipefail
          node scripts/capture-promotion-memory.mjs 2>&1 | tee promotion-memory-audit.log

      - name: Verify drag-to-scan checkout
        run: |
          set -o pipefail
          node scripts/capture-checkout-scanning.mjs 2>&1 | tee checkout-scanning-audit.log

      - name: Upload CrazyGames release package
        uses: actions/upload-artifact@v4
        with:
          name: crazygames-release
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: |
            ui-audit
            ui-audit-run.log
            level-briefing-audit.log
            guided-delivery-audit.log
            promotion-memory-audit.log
            checkout-scanning-audit.log
            build.log
            release-check.log
            release-payload.log
            release-payload-report.json
          if-no-files-found: warn

      - name: Publish UI regression status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;
            const passed = "${{ job.status }}" === "success";
            let description = "Campaign, briefings, guided controls, memory and checkout regressions passed";
            let failureKey = "runtime";

            const failedAssertions = (path) => {
              if (!fs.existsSync(path)) return null;
              const report = JSON.parse(fs.readFileSync(path, "utf8"));
              const failed = Object.entries(report.assertions ?? {})
                .filter(([, value]) => !value)
                .map(([key]) => key);
              return { report, failed };
            };

            if (!passed) {
              try {
                const checkout = failedAssertions("ui-audit/checkout-scanning-audit.json");
                const memory = failedAssertions("ui-audit/promotion-memory-audit.json");
                const guided = failedAssertions("ui-audit/guided-delivery-audit.json");
                const briefing = failedAssertions("ui-audit/level-briefing-audit.json");
                if (checkout && (checkout.report.fatalError || checkout.failed.length > 0)) {
                  failureKey = `checkout:${checkout.failed.join("+") || "runtime"}`;
                  description = checkout.report.fatalError || `Failed: ${failureKey}`;
                } else if (memory && (memory.report.fatalError || memory.failed.length > 0)) {
                  failureKey = `memory:${memory.failed.join("+") || "runtime"}`;
                  description = memory.report.fatalError || `Failed: ${failureKey}`;
                } else if (guided && (guided.report.fatalError || guided.failed.length > 0)) {
                  failureKey = `guided:${guided.failed.join("+") || "runtime"}`;
                  description = guided.report.fatalError || `Failed: ${failureKey}`;
                } else if (briefing && (briefing.report.fatalError || briefing.failed.length > 0)) {
                  failureKey = `briefing:${briefing.failed.join("+") || "runtime"}`;
                  description = briefing.report.fatalError || `Failed: ${failureKey}`;
                } else if (fs.existsSync("ui-audit/ui-audit-report.json")) {
                  const report = JSON.parse(fs.readFileSync("ui-audit/ui-audit-report.json", "utf8"));
                  const failed = Object.entries(report.regressions ?? {})
                    .filter(([, value]) => !value)
                    .map(([key]) => key);
                  failureKey = failed.join("+") || "runtime";
                  const browserIssues = (report.consoleErrors?.length ?? 0)
                    + (report.pageErrors?.length ?? 0)
                    + (report.failedRequests?.length ?? 0)
                    + (report.badResponses?.length ?? 0);
                  description = `Failed: ${failureKey}; browser issues ${browserIssues}`;
                } else if (fs.existsSync("release-payload-report.json")) {
                  const payloadReport = JSON.parse(fs.readFileSync("release-payload-report.json", "utf8"));
                  failureKey = "release-payload";
                  description = payloadReport.fatalError || "Release payload audit failed";
                } else if (fs.existsSync("build.log")) {
                  const buildLines = fs.readFileSync("build.log", "utf8").trim().split(/\r?\n/);
                  const buildError = buildLines.find((line) => line.includes("error TS")) || buildLines.at(-1);
                  failureKey = "build";
                  description = `Failed: ${buildError || "build"}`;
                } else {
                  description = "UI regression audit failed; inspect workflow log";
                }
              } catch (error) {
                description = `UI regression audit failed: ${String(error)}`;
              }
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? "success" : "failure",
              context: passed ? "UI Regression Audit" : `UI Regression Audit (${failureKey})`,
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
