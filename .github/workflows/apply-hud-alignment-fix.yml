name: Apply HUD Alignment Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-hud-alignment-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix long mode labels in day panel
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/game/presentation/ui/ShiftHud.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    const modeWidth = 82;\n    const modePill = scene.add.graphics().setDepth(102);',
              '    const modeWidth = 94;\n    const modeLabel = config.modeLabel ?? "STORE SHIFT";\n    const modeFontSize = modeLabel.length > 13 ? "7px" : modeLabel.length > 10 ? "8px" : "10px";\n    const modePill = scene.add.graphics().setDepth(102);'
          )
          text = text.replace(
              'scene.add.text(hud.dayPanel.x + 14 + modeWidth / 2, hud.dayPanel.y + 20, config.modeLabel ?? "STORE SHIFT", {',
              'scene.add.text(hud.dayPanel.x + 14 + modeWidth / 2, hud.dayPanel.y + 20, modeLabel, {'
          )
          text = text.replace('      fontSize: "10px",\n      color: "#ffffff",\n      fontStyle: "bold",\n      letterSpacing: 1\n    }).setOrigin(0.5).setDepth(103);\n    scene.add.text(hud.dayPanel.x + 108, hud.dayPanel.y + 11, config.dayLabel, {\n      fontFamily: "Arial",\n      fontSize: "16px",',
              '      fontSize: modeFontSize,\n      color: "#ffffff",\n      fontStyle: "bold",\n      letterSpacing: 0\n    }).setOrigin(0.5).setDepth(103);\n    scene.add.text(hud.dayPanel.x + 118, hud.dayPanel.y + 12, config.dayLabel, {\n      fontFamily: "Arial",\n      fontSize: "14px",')
          if text == path.read_text(encoding="utf-8"):
              raise SystemExit("Expected ShiftHud source patterns were not found")
          path.write_text(text, encoding="utf-8")
      - name: Commit HUD alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/presentation/ui/ShiftHud.ts
          git commit -m "fix: prevent long mode labels from overlapping day HUD"
          git push origin HEAD:main
