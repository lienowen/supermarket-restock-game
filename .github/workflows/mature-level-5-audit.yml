name: Mature Level 5 Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/game/assets/MaturePassAssetCatalogue.ts"
      - "src/game/assets/RuntimeAssetRegistry.ts"
      - "src/game/assets/LevelAssetResolver.ts"
      - "src/game/content/levels/starterMarketLevels.ts"
      - "src/game/infrastructure/phaser/GameplaySceneRegistry.ts"
      - "src/game/presentation/findItems/OrderTicketView.ts"
      - "src/game/presentation/scenes/GoldenOrderHuntScene.ts"
      - "src/game/presentation/ui/VirtualJoystick.ts"
      - "src/game/presentation/world/StarterMarketEnvironmentView.ts"
      - "src/game/presentation/visual/LevelVisualPresetResolver.ts"
      - "src/game/presentation/visual/MarketLevelVisualPreset.ts"
      - "src/game/presentation/visual/OpaqueCutoutTexture.ts"
      - "src/game/presentation/visual/TrimmedTexture.ts"
      - "scripts/capture-golden-order-hunt.mjs"
      - "scripts/capture-golden-order-hunt-mobile.mjs"
      - "scripts/capture-golden-worker-motion.mjs"
      - "scripts/capture-l5-order-overlap.mjs"
      - ".github/workflows/mature-level-5-audit.yml"
  pull_request:
    paths:
      - "src/game/assets/MaturePassAssetCatalogue.ts"
      - "src/game/assets/RuntimeAssetRegistry.ts"
      - "src/game/assets/LevelAssetResolver.ts"
      - "src/game/content/levels/starterMarketLevels.ts"
      - "src/game/infrastructure/phaser/GameplaySceneRegistry.ts"
      - "src/game/presentation/findItems/OrderTicketView.ts"
      - "src/game/presentation/scenes/GoldenOrderHuntScene.ts"
      - "src/game/presentation/ui/VirtualJoystick.ts"
      - "src/game/presentation/world/StarterMarketEnvironmentView.ts"
      - "src/game/presentation/visual/LevelVisualPresetResolver.ts"
      - "src/game/presentation/visual/MarketLevelVisualPreset.ts"
      - "src/game/presentation/visual/OpaqueCutoutTexture.ts"
      - "src/game/presentation/visual/TrimmedTexture.ts"
      - "scripts/capture-golden-order-hunt.mjs"
      - "scripts/capture-golden-order-hunt-mobile.mjs"
      - "scripts/capture-golden-worker-motion.mjs"
      - "scripts/capture-l5-order-overlap.mjs"
      - ".github/workflows/mature-level-5-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  golden-level:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Verify Level 5 desktop three-zone flow
        id: desktop
        continue-on-error: true
        run: node scripts/capture-golden-order-hunt.mjs
      - name: Verify Level 5 worker movement
        id: motion
        continue-on-error: true
        run: node scripts/capture-golden-worker-motion.mjs
      - name: Verify Level 5 Android software-landscape touch flow
        id: mobile
        continue-on-error: true
        run: node scripts/capture-golden-order-hunt-mobile.mjs
      - name: Diagnose Level 5 order icon overlap
        id: overlap
        continue-on-error: true
        run: node scripts/capture-l5-order-overlap.mjs
      - name: Upload Level 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-5-audit
          path: |
            ui-audit/golden-order-hunt
            ui-audit/golden-order-hunt-mobile
            ui-audit/golden-order-overlap
          if-no-files-found: error
          retention-days: 14
      - name: Publish Level 5 commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          MOTION_OUTCOME: ${{ steps.motion.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
          OVERLAP_OUTCOME: ${{ steps.overlap.outcome }}
        run: |
          if [ "$DESKTOP_OUTCOME" = "success" ] && [ "$MOTION_OUTCOME" = "success" ] && [ "$MOBILE_OUTCOME" = "success" ] && [ "$OVERLAP_OUTCOME" = "success" ]; then
            STATE=success
            DESC="L5 desktop, motion, joystick, order icons and overlap checks passed"
          else
            STATE=failure
            DESC="mature Level 5 desktop/motion/mobile/order overlap audit failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 5 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Enforce Level 5 result
        if: always()
        run: |
          test "${{ steps.desktop.outcome }}" = "success"
          test "${{ steps.motion.outcome }}" = "success"
          test "${{ steps.mobile.outcome }}" = "success"
          test "${{ steps.overlap.outcome }}" = "success"
