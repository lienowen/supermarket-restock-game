name: Mature Level 7 Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/main.ts"
      - "src/game/assets/GlobalProjectAssetCatalogue.ts"
      - "src/game/content/experience/CheckoutPatienceExperienceSpec.ts"
      - "src/game/infrastructure/browser/CheckoutSoftwareLandscapeDrag.ts"
      - "src/game/infrastructure/phaser/createPhaserGame.ts"
      - "src/game/presentation/ui/CheckoutPatienceDom.ts"
      - "src/mobile-playability.css"
      - "scripts/materialize-assets.mjs"
      - "asset-source/l7-patience/**"
      - "public/assets/game/production-v1/characters/customers/*.png"
      - "public/assets/game/missing-assets-batch-01/equipment-produce-scale.png"
      - "public/assets/game/missing-assets-batch-01/customer-*.png"
      - "scripts/capture-checkout-patience.mjs"
      - "scripts/capture-checkout-patience-mobile.mjs"
      - ".github/workflows/mature-level-7-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  level7:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify Level 7 desktop patience flow
        id: desktop
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/capture-checkout-patience.mjs

      - name: Verify Level 7 Android software-landscape touch flow
        id: mobile
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/capture-checkout-patience-mobile.mjs

      - name: Upload Level 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-7-audit
          path: |
            ui-audit/mature-level-7
            ui-audit/mature-level-7-mobile
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Level 7 commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$DESKTOP_OUTCOME" = "success" ] && [ "$MOBILE_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Level 7 scale + mood + 8-customer desktop/Android flow passed"
          else
            STATE=failure
            DESC="mature Level 7 desktop/Android audit failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 7 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Level 7 result
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.desktop.outcome }}" = "success"
          test "${{ steps.mobile.outcome }}" = "success"
