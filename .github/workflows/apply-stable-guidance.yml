name: Apply Stable Guidance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stable-guidance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze worker movement and HUD scale
        shell: python
        run: |
          from pathlib import Path

          actor_path = Path("src/game/presentation/actors/RestockActorView.ts")
          actor = actor_path.read_text(encoding="utf-8")
          actor_new = actor.replace(
              '    });\n\n    this.cartShadow = scene.add.ellipse(',
              '    });\n    this.navigation.setEnabled(false);\n\n    this.cartShadow = scene.add.ellipse(',
              1
          )
          if actor_new == actor:
              raise SystemExit("Could not locate restock navigation constructor")
          actor_path.write_text(actor_new, encoding="utf-8")

          hud_path = Path("src/game/presentation/ui/ShiftHud.ts")
          hud = hud_path.read_text(encoding="utf-8")

          old_objective = '''  private animateObjectiveChange(objective: string): void {
    this.scene.tweens.killTweensOf(this.objectiveText);
    this.objectiveText
      .setText(objective)
      .setAlpha(0.35)
      .setScale(0.97);
    this.scene.tweens.add({
      targets: this.objectiveText,
      alpha: 1,
      scaleX: 1,
      scaleY: 1,
      duration: 230,
      ease: "Back.Out"
    });
  }'''
          new_objective = '''  private animateObjectiveChange(objective: string): void {
    this.scene.tweens.killTweensOf(this.objectiveText);
    this.objectiveText
      .setText(objective)
      .setAlpha(1)
      .setScale(1);
  }'''
          hud = hud.replace(old_objective, new_objective)

          old_progress = '''    if (snapshot.stockedRows !== this.previousProgress && this.previousProgress >= 0) {
      this.progressText.setScale(1.14);
      this.scene.tweens.add({
        targets: this.progressText,
        scaleX: 1,
        scaleY: 1,
        duration: 210,
        ease: "Back.Out"
      });
      if (snapshot.stockedRows > this.previousProgress) {
        this.emitProgressSparkles(objectivePanel.x + 62 + fillWidth, objectivePanel.y + 62);
      }
    }'''
          new_progress = '''    if (snapshot.stockedRows !== this.previousProgress && this.previousProgress >= 0) {
      this.scene.tweens.killTweensOf(this.progressText);
      this.progressText.setScale(1);
      if (snapshot.stockedRows > this.previousProgress) {
        this.emitProgressSparkles(objectivePanel.x + 62 + fillWidth, objectivePanel.y + 62);
      }
    }'''
          hud = hud.replace(old_progress, new_progress)

          old_action = '''  private animateActionReady(): void {
    this.scene.tweens.killTweensOf([this.actionHalo, this.actionLabel]);
    this.actionHalo.setAlpha(0.82).setScale(0.94);
    this.actionLabel.setScale(0.92);
    this.scene.tweens.add({
      targets: this.actionHalo,
      alpha: 0,
      scaleX: 1.12,
      scaleY: 1.24,
      duration: 620,
      ease: "Cubic.Out"
    });
    this.scene.tweens.add({
      targets: this.actionLabel,
      scaleX: 1,
      scaleY: 1,
      duration: 260,
      ease: "Back.Out"
    });
  }'''
          new_action = '''  private animateActionReady(): void {
    this.scene.tweens.killTweensOf([this.actionHalo, this.actionLabel]);
    this.actionHalo.setAlpha(0).setScale(1);
    this.actionLabel.setScale(1);
  }'''
          hud = hud.replace(old_action, new_action)

          start = hud.index('  private emitProgressSparkles(')
          if start < 0:
              raise SystemExit("Could not locate progress sparkle method")
          end = hud.index('\n  }\n}', start)
          if end < 0:
              raise SystemExit("Could not locate progress sparkle method end")
          end += len('\n  }')
          hud = hud[:start] + '''  private emitProgressSparkles(_x: number, _y: number): void {
    // Progress updates remain visually stable; the bar changes without moving the task panel.
  }''' + hud[end:]

          if hud == hud_path.read_text(encoding="utf-8"):
              raise SystemExit("HUD stability patterns were not changed")
          hud_path.write_text(hud, encoding="utf-8")
      - name: Commit stable guidance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/presentation/actors/RestockActorView.ts src/game/presentation/ui/ShiftHud.ts
          git commit -m "fix: stabilize the worker and task guidance"
          git push origin HEAD:main
