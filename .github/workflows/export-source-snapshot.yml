name: Export source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove accidental branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/DO_NOT_CREATE'
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }

      - name: Record base tree
        shell: bash
        run: git rev-parse HEAD^{tree} > tree-sha.txt

      - name: Upload base tree
        uses: actions/upload-artifact@v4
        with:
          name: base-tree-sha
          path: tree-sha.txt
          retention-days: 1

      - name: Publish source snapshot status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Base Tree Export',
              description: 'Base tree ready for atomic asset commit',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
