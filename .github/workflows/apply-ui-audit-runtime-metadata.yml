name: Apply UI audit runtime metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-audit-runtime-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply metadata patch
        run: python3 scripts/fix-ui-audit-runtime-metadata.py

      - name: Validate patch
        run: |
          npm ci
          npm test
          npm run build
          node --check scripts/capture-release-regressions.mjs

      - name: Commit validated audit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-release-regressions.mjs
          git rm scripts/fix-ui-audit-runtime-metadata.py
          git commit -m "Fix UI audit runtime metadata checks"
          git push origin HEAD:main
