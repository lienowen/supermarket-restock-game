name: Closing Safety Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closing-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-closing-safety-cleanup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closing-safety-audit
          path: ui-audit/mature-level-8
