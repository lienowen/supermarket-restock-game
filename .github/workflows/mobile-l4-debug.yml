name: Mobile L4 Debug

on:
  push:
    branches: [test/mobile-l4-software-landscape]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  mobile-l4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish pending mobile L4 status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "Mobile L4 Touch Audit",
              description: "Testing Android portrait software-landscape touch",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Run Android portrait L4 touch audit
        id: audit
        continue-on-error: true
        run: node scripts/capture-mobile-software-landscape-clean.mjs
      - name: Upload mobile L4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-l4-debug
          path: ui-audit/mobile-software-landscape-clean
          if-no-files-found: warn
      - name: Publish mobile L4 result
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const passed = process.env.AUDIT_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "Mobile L4 Touch Audit",
              description: passed ? "Android portrait L4 touch passed" : "Android portrait L4 touch failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Enforce mobile L4 audit
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
