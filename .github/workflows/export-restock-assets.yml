name: Export Restock Source Assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-restock-assets.yml

permissions:
  contents: read

jobs:
  export-restock-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect existing production assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Exporting the approved existing restock assets from main"
          mkdir -p export/worker export/cart export/cases export/cooler export/products export/background
          cp public/assets/game/production-v1/characters/worker/worker-idle.png export/worker/
          cp public/assets/game/production-v1/characters/worker/worker-open-box.png export/worker/
          cp public/assets/game/production-v1/characters/worker/worker-stock-shelf.png export/worker/
          cp public/assets/game/production-v1/characters/worker/worker-push-cart.png export/worker/
          cp public/assets/game/production-v1/props/equipment-restock-cart-empty.png export/cart/
          cp public/assets/game/production-v1/props/equipment-restock-cart-loaded.webp export/cart/
          cp public/assets/game/production-v2/cooler-restock/cola_case_open_hd.png export/cases/
          cp public/assets/game/production-v2/cooler-restock/cola_case_closed_hd.png export/cases/
          cp public/assets/game/production-v2/cooler-restock/cola_bottle_hd.png export/products/
          cp public/assets/game/production-v3/cooler-restock/cooler_empty_back_hd.png export/cooler/
          cp public/assets/game/production-v3/cooler-restock/cooler_front_glass_hd.png export/cooler/
          cp public/assets/game/production-v3/cooler-restock/market_bg_hd.png export/background/

      - name: Upload source asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: restock-source-assets
          path: export
          if-no-files-found: error
          retention-days: 1
