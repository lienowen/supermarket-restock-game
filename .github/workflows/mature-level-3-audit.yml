name: Mature Level 3 Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/game/infrastructure/browser/CheckoutSoftwareLandscapeDrag.ts"
      - "src/game/presentation/ui/CheckoutScanDom.ts"
      - "src/game/presentation/checkout/**"
      - "src/game/presentation/scenes/CheckoutMarketScene.ts"
      - "src/main.ts"
      - "scripts/capture-mature-checkout.mjs"
      - "scripts/capture-checkout-mobile.mjs"
      - ".github/workflows/mature-level-3-audit.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Verify desktop Level 3 checkout
        id: desktop
        continue-on-error: true
        run: node scripts/capture-mature-checkout.mjs

      - name: Verify rotated mobile Level 3 checkout
        id: mobile
        continue-on-error: true
        run: node scripts/capture-checkout-mobile.mjs

      - name: Upload Level 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-3-audit
          path: |
            ui-audit/mature-checkout
            ui-audit/mature-level-3-mobile
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Level 3 commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          if [ "$DESKTOP_OUTCOME" = "success" ] && [ "$MOBILE_OUTCOME" = "success" ]; then
            STATE=success
            DESC="L3 desktop + rotated mobile checkout passed"
          else
            STATE=failure
            DESC="L3 checkout failed on desktop or rotated mobile"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 3 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Level 3 result
        if: always()
        run: |
          test "${{ steps.desktop.outcome }}" = "success"
          test "${{ steps.mobile.outcome }}" = "success"
