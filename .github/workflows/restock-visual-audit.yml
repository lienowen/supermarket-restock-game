name: Restock Visual Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Download repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            | tar -xz --strip-components=1

      - name: Prepare focused browser audit
        run: |
          npm ci > /tmp/restock-npm-ci.log 2>&1
          npm install --no-save --package-lock=false playwright > /tmp/restock-playwright-package.log 2>&1
          npx playwright install --with-deps chromium > /tmp/restock-playwright-browser.log 2>&1
          npm run build > /tmp/restock-build.log 2>&1

      - name: Run focused capture
        id: capture
        continue-on-error: true
        run: node scripts/capture-restock-empty-to-full.mjs > /tmp/restock-capture.log 2>&1

      - name: Print focused result and visual evidence
        if: always()
        run: |
          echo "CAPTURE_OUTCOME=${{ steps.capture.outcome }}"
          echo "GENERATED_FILES_BEGIN"
          find restock-visual-audit -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          echo "GENERATED_FILES_END"
          echo "CAPTURE_LOG_TAIL_BEGIN"
          tail -n 30 /tmp/restock-capture.log || true
          echo "CAPTURE_LOG_TAIL_END"

          if [ -f restock-visual-audit/restock-visual-audit.json ]; then
            echo "REPORT_JSON_BEGIN"
            node - <<'NODE'
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('restock-visual-audit/restock-visual-audit.json', 'utf8'));
            const states = (report.states ?? []).map((state) => ({
              itemCount: state.itemCount,
              stockedRows: state.controller?.stockedRows,
              activeRowItemCount: state.rush?.activeRowItemCount,
              filledRowIndexes: state.rush?.filledRowIndexes,
              backgroundState: state.backgroundState,
              shell: state.shell
            }));
            console.log(JSON.stringify({
              assertions: report.assertions,
              fatalError: report.fatalError,
              rowIndex: report.rowIndex,
              states
            }));
            NODE
            echo "REPORT_JSON_END"
          fi

          if [ -f restock-visual-audit/restock-contact-sheet.jpg ]; then
            echo "CONTACT_BASE64_BEGIN"
            base64 -w0 restock-visual-audit/restock-contact-sheet.jpg | fold -w 4000
            echo
            echo "CONTACT_BASE64_END"
          fi

          test "${{ steps.capture.outcome }}" = "success"
