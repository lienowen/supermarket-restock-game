name: Restock Visual Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      capture_outcome: ${{ steps.capture_restock.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci > npm-ci.log 2>&1

      - name: Install Playwright
        run: npx playwright install --with-deps chromium > playwright-install.log 2>&1

      - name: Build production bundle
        run: npm run build > focused-build.log 2>&1

      - name: Capture empty-to-full restock
        id: capture_restock
        continue-on-error: true
        run: node scripts/capture-restock-empty-to-full.mjs

      - name: Save focused restock evidence cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: restock-visual-audit
          key: restock-visual-${{ github.run_id }}

  evidence:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]

    steps:
      - name: Restore focused restock evidence cache
        uses: actions/cache/restore@v4
        with:
          path: restock-visual-audit
          key: restock-visual-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Print restock evidence chunk
        env:
          PART: ${{ matrix.part }}
          CAPTURE_OUTCOME: ${{ needs.capture.outputs.capture_outcome }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          part = int(os.environ["PART"])
          total_parts = 4
          report = json.loads(Path("restock-visual-audit/restock-visual-audit.json").read_text())
          contact = base64.b64encode(
              Path("restock-visual-audit/restock-contact-sheet.jpg").read_bytes()
          ).decode("ascii")
          start = len(contact) * part // total_parts
          end = len(contact) * (part + 1) // total_parts
          chunk = contact[start:end]

          print(f"CAPTURE_OUTCOME={os.environ['CAPTURE_OUTCOME']}")
          if part == 0:
              compact_states = []
              for state in report.get("states", []):
                  compact_states.append({
                      "itemCount": state.get("itemCount"),
                      "stockedRows": (state.get("controller") or {}).get("stockedRows"),
                      "activeRowItemCount": (state.get("rush") or {}).get("activeRowItemCount"),
                      "filledRowIndexes": (state.get("rush") or {}).get("filledRowIndexes"),
                      "shell": state.get("shell"),
                      "backgroundState": state.get("backgroundState"),
                  })
              summary = {
                  "assertions": report.get("assertions"),
                  "fatalError": report.get("fatalError"),
                  "rowIndex": report.get("rowIndex"),
                  "states": compact_states,
                  "contactBase64Length": len(contact),
              }
              print("SUMMARY_JSON=" + json.dumps(summary, separators=(",", ":")))
          print(f"CONTACT_PART_{part}_BEGIN")
          for offset in range(0, len(chunk), 5000):
              print(chunk[offset:offset + 5000])
          print(f"CONTACT_PART_{part}_END")
          PY
          test "$CAPTURE_OUTCOME" = "success"
