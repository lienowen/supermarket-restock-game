name: Restock Visual Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contact_b64: ${{ steps.export_contact.outputs.contact_b64 }}
      summary_b64: ${{ steps.export_summary.outputs.summary_b64 }}
      capture_outcome: ${{ steps.capture_restock.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci > npm-ci.log 2>&1

      - name: Install Playwright
        run: npx playwright install --with-deps chromium > playwright-install.log 2>&1

      - name: Build production bundle
        run: npm run build > focused-build.log 2>&1

      - name: Capture empty-to-full restock
        id: capture_restock
        continue-on-error: true
        run: node scripts/capture-restock-empty-to-full.mjs

      - name: Export restock summary
        id: export_summary
        if: always()
        continue-on-error: true
        run: |
          test -f restock-visual-audit/restock-visual-audit.json
          node - <<'NODE' > /tmp/restock-summary.json
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('restock-visual-audit/restock-visual-audit.json', 'utf8'));
          const states = (report.states || []).map((state) => ({
            itemCount: state.itemCount,
            stockedRows: state.controller?.stockedRows,
            activeRowItemCount: state.rush?.activeRowItemCount,
            filledRowIndexes: state.rush?.filledRowIndexes,
            shell: state.shell,
            backgroundState: state.backgroundState
          }));
          process.stdout.write(JSON.stringify({
            assertions: report.assertions,
            fatalError: report.fatalError,
            rowIndex: report.rowIndex,
            states
          }));
          NODE
          echo "summary_b64=$(base64 -w0 /tmp/restock-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Export restock contact sheet
        id: export_contact
        if: always()
        continue-on-error: true
        run: |
          if [ -f restock-visual-audit/restock-contact-sheet.jpg ]; then
            {
              echo 'contact_b64<<RESTOCK_CONTACT_EOF'
              base64 -w76 restock-visual-audit/restock-contact-sheet.jpg
              echo 'RESTOCK_CONTACT_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'contact_b64=' >> "$GITHUB_OUTPUT"
          fi

  evidence:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print compact visual evidence
        env:
          CONTACT_B64: ${{ needs.capture.outputs.contact_b64 }}
          SUMMARY_B64: ${{ needs.capture.outputs.summary_b64 }}
          CAPTURE_OUTCOME: ${{ needs.capture.outputs.capture_outcome }}
        run: |
          echo "CAPTURE_OUTCOME=$CAPTURE_OUTCOME"
          echo "SUMMARY_B64_BEGIN"
          printf '%s' "$SUMMARY_B64" | fold -w 3000
          echo
          echo "SUMMARY_B64_END"
          echo "CONTACT_B64_BEGIN"
          printf '%s' "$CONTACT_B64" | tr -d '\n\r' | fold -w 3000
          echo
          echo "CONTACT_B64_END"
          test "$CAPTURE_OUTCOME" = "success"
