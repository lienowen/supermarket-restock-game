name: Restock Visual Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium > playwright-install.log 2>&1

      - name: Build production bundle
        run: npm run build

      - name: Capture empty-to-full restock
        id: capture-restock
        continue-on-error: true
        run: node scripts/capture-restock-empty-to-full.mjs

      - name: Print restock visual report
        if: always()
        run: |
          if [ -f restock-visual-audit/restock-visual-audit.json ]; then
            cat restock-visual-audit/restock-visual-audit.json
          else
            echo "restock visual report was not created"
          fi

      - name: Upload restock visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restock-empty-to-full-visual
          path: restock-visual-audit
          if-no-files-found: error

      - name: Enforce restock visual result
        if: always()
        run: test "${{ steps.capture-restock.outcome }}" = "success"
