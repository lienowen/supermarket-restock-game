name: Restock Visual Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]

    steps:
      - name: Download repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            | tar -xz --strip-components=1

      - name: Prepare focused browser audit
        run: |
          npm ci > /tmp/restock-npm-ci.log 2>&1
          npx playwright install --with-deps chromium > /tmp/restock-playwright.log 2>&1
          npm run build > /tmp/restock-build.log 2>&1

      - name: Capture and print restock evidence chunk
        env:
          PART: ${{ matrix.part }}
        run: |
          set +e
          node scripts/capture-restock-empty-to-full.mjs > /tmp/restock-capture.log 2>&1
          CAPTURE_STATUS=$?
          set -e

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          part = int(os.environ["PART"])
          total_parts = 4
          report_path = Path("restock-visual-audit/restock-visual-audit.json")
          contact_path = Path("restock-visual-audit/restock-contact-sheet.jpg")
          if not report_path.is_file():
              raise SystemExit("restock visual report is missing")
          if not contact_path.is_file():
              print(Path("/tmp/restock-capture.log").read_text(errors="replace"))
              raise SystemExit("restock contact sheet is missing")

          report = json.loads(report_path.read_text())
          contact = base64.b64encode(contact_path.read_bytes()).decode("ascii")
          start = len(contact) * part // total_parts
          end = len(contact) * (part + 1) // total_parts
          chunk = contact[start:end]

          if part == 0:
              compact_states = []
              for state in report.get("states", []):
                  compact_states.append({
                      "itemCount": state.get("itemCount"),
                      "stockedRows": (state.get("controller") or {}).get("stockedRows"),
                      "activeRowItemCount": (state.get("rush") or {}).get("activeRowItemCount"),
                      "filledRowIndexes": (state.get("rush") or {}).get("filledRowIndexes"),
                      "shell": state.get("shell"),
                      "backgroundState": state.get("backgroundState"),
                  })
              summary = {
                  "assertions": report.get("assertions"),
                  "fatalError": report.get("fatalError"),
                  "rowIndex": report.get("rowIndex"),
                  "states": compact_states,
                  "contactBase64Length": len(contact),
              }
              print("SUMMARY_JSON=" + json.dumps(summary, separators=(",", ":")))
          print(f"CONTACT_PART_{part}_BEGIN")
          for offset in range(0, len(chunk), 5000):
              print(chunk[offset:offset + 5000])
          print(f"CONTACT_PART_{part}_END")
          PY

          exit "$CAPTURE_STATUS"
