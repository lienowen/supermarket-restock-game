name: Restock Visual Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contact_b64: ${{ steps.export.outputs.contact_b64 }}
      report_b64: ${{ steps.export.outputs.report_b64 }}
      capture_outcome: ${{ steps.capture_restock.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci > npm-ci.log 2>&1

      - name: Install Playwright
        run: npx playwright install --with-deps chromium > playwright-install.log 2>&1

      - name: Build production bundle
        run: npm run build > focused-build.log 2>&1

      - name: Capture empty-to-full restock
        id: capture_restock
        continue-on-error: true
        run: node scripts/capture-restock-empty-to-full.mjs

      - name: Export visual evidence
        id: export
        if: always()
        run: |
          test -f restock-visual-audit/restock-contact-sheet.jpg
          test -f restock-visual-audit/restock-visual-audit.json
          echo "contact_b64=$(base64 -w0 restock-visual-audit/restock-contact-sheet.jpg)" >> "$GITHUB_OUTPUT"
          echo "report_b64=$(base64 -w0 restock-visual-audit/restock-visual-audit.json)" >> "$GITHUB_OUTPUT"

  evidence:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print compact visual evidence
        env:
          CONTACT_B64: ${{ needs.capture.outputs.contact_b64 }}
          REPORT_B64: ${{ needs.capture.outputs.report_b64 }}
          CAPTURE_OUTCOME: ${{ needs.capture.outputs.capture_outcome }}
        run: |
          echo "CAPTURE_OUTCOME=$CAPTURE_OUTCOME"
          echo "REPORT_B64_BEGIN"
          printf '%s' "$REPORT_B64" | fold -w 3000
          echo
          echo "REPORT_B64_END"
          echo "CONTACT_B64_BEGIN"
          printf '%s' "$CONTACT_B64" | fold -w 3000
          echo
          echo "CONTACT_B64_END"
          test "$CAPTURE_OUTCOME" = "success"
