name: Mature Level 1 Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/game/presentation/ui/GuidedDragActionDom.ts"
      - "src/game/infrastructure/browser/MobileLandscapeController.ts"
      - "src/game/infrastructure/phaser/SoftwareLandscapeInput.ts"
      - "src/mobile-playability.css"
      - "src/mobile-landscape-fit.css"
      - "src/main.ts"
      - "scripts/capture-guided-delivery.mjs"
      - "scripts/capture-guided-delivery-mobile.mjs"
      - ".github/workflows/mature-level-1-audit.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  guided-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Desktop guided drag diagnostics
        id: desktop
        continue-on-error: true
        run: node scripts/capture-guided-delivery.mjs

      - name: Verify rotated mobile touch guided drag
        id: mobile
        continue-on-error: true
        run: node scripts/capture-guided-delivery-mobile.mjs

      - name: Upload Level 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-1-audit
          path: |
            ui-audit/guided-delivery-drag-active.png
            ui-audit/guided-delivery-after-drag.png
            ui-audit/guided-delivery-audit.json
            ui-audit/mature-level-1-mobile
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Level 1 commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          if [ "$MOBILE_OUTCOME" = "success" ]; then
            STATE=success
            DESC="L1 rotated mobile touch drag passed"
          else
            STATE=failure
            DESC="L1 rotated mobile touch drag failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 1 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Level 1 mobile result
        if: always()
        run: test "${{ steps.mobile.outcome }}" = "success"
