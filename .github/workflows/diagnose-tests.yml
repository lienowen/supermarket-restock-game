name: Diagnose Tests

on:
  push:
    branches:
      - rebuild/supermarket-scene-v1
    paths:
      - .github/workflows/diagnose-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture complete test output
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          echo "$status" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: diagnose-test-output
          path: |
            test-output.log
            test-status.txt
      - name: Preserve test result
        shell: bash
        run: exit "$(cat test-status.txt)"
