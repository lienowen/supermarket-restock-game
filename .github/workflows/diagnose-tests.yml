name: Diagnose Individual Tests

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-flow
            file: tests/core-flow.test.cjs
          - name: v3-architecture
            file: tests/v3-architecture.test.cjs
          - name: v3-catalogues
            file: tests/v3-catalogues.test.cjs
          - name: v3-visual-target
            file: tests/v3-visual-target.test.cjs
          - name: v3-campaign-runtime
            file: tests/v3-campaign-runtime.test.cjs
          - name: v3-campaign-session
            file: tests/v3-campaign-session.test.cjs
          - name: v3-level-runtime
            file: tests/v3-level-runtime.test.cjs
          - name: v3-level-progression
            file: tests/v3-level-progression.test.cjs
          - name: v3-player-navigation
            file: tests/v3-player-navigation.test.cjs
          - name: v3-checkout-runtime
            file: tests/v3-checkout-runtime.test.cjs
          - name: v3-shift-runtime
            file: tests/v3-shift-runtime.test.cjs
          - name: v3-restock-rush
            file: tests/v3-restock-rush.test.cjs
          - name: v3-find-items-challenge
            file: tests/v3-find-items-challenge.test.cjs
          - name: v3-presentation-context
            file: tests/v3-presentation-context.test.cjs
          - name: v3-foundation-contracts
            file: tests/v3-foundation-contracts.test.cjs
          - name: v3-standard-market-rules
            file: tests/v3-standard-market-rules.test.cjs
          - name: v3-boundaries
            file: tests/v3-boundaries.test.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/materialize-assets.mjs
      - run: npx --no-install tsc -p tsconfig.test.json
      - run: mkdir -p .test-dist && printf '{"type":"commonjs"}\n' > .test-dist/package.json
      - run: node --test "${{ matrix.file }}"
