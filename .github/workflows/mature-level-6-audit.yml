name: Mature Level 6 Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/game/assets/GlobalProjectAssetCatalogue.ts"
      - "src/game/content/experience/CartCapacityExperienceSpec.ts"
      - "src/game/infrastructure/phaser/createPhaserGame.ts"
      - "src/game/presentation/ui/CartCapacityLoadDom.ts"
      - "scripts/capture-cart-capacity.mjs"
      - ".github/workflows/mature-level-6-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  level6:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify mature Level 6 capacity flow
        id: audit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/capture-cart-capacity.mjs

      - name: Upload Level 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-6-audit
          path: |
            ui-audit/cart-capacity-audit.json
            ui-audit/cart-capacity-active.png
            ui-audit/cart-capacity-wrong-size.png
            ui-audit/cart-capacity-first-load-full.png
            ui-audit/cart-capacity-delivery-continues.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Level 6 commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$AUDIT_OUTCOME" = "success" ]; then
            STATE=success
            DESC="two-load small/medium/large capacity puzzle passed"
          else
            STATE=failure
            DESC="mature Level 6 build/browser audit failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 6 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Level 6 result
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
