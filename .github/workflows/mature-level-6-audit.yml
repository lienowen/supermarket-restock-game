name: Mature Level 6 Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/game/assets/GlobalProjectAssetCatalogue.ts"
      - "src/game/content/experience/CartCapacityExperienceSpec.ts"
      - "src/game/infrastructure/phaser/createPhaserGame.ts"
      - "src/game/presentation/ui/CartCapacityLoadDom.ts"
      - "src/game/presentation/world/StarterMarketEnvironmentView.ts"
      - "src/mobile-playability.css"
      - "scripts/capture-cart-capacity.mjs"
      - "scripts/capture-cart-capacity-mobile.mjs"
      - ".github/workflows/mature-level-6-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  level6:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify Level 6 desktop six-space flow
        id: desktop
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/capture-cart-capacity.mjs

      - name: Verify Level 6 Android software-landscape touch flow
        id: mobile
        if: ${{ always() && steps.build.outcome == 'success' && steps.desktop.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/capture-cart-capacity-mobile.mjs

      - name: Upload Level 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-6-audit
          path: |
            ui-audit/cart-capacity
            ui-audit/cart-capacity-mobile
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Level 6 commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$DESKTOP_OUTCOME" = "success" ] && [ "$MOBILE_OUTCOME" = "success" ]; then
            STATE=success
            DESC="two-trip six-space capacity puzzle passed desktop + Android"
          else
            STATE=failure
            DESC="mature Level 6 build/browser/touch audit failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 6 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Level 6 result
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.desktop.outcome }}" = "success"
          test "${{ steps.mobile.outcome }}" = "success"
