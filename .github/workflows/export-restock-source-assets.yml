name: Export restock source assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-restock-source-assets.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restock-source-assets
          cp public/assets/game/production-v1/props/equipment-restock-cart-empty.png restock-source-assets/
          cp public/assets/game/production-v1/props/equipment-restock-cart-loaded.webp restock-source-assets/
          cp public/assets/game/production-v2/cooler-restock/cola_case_open_hd.png restock-source-assets/
          cp public/assets/game/production-v2/cooler-restock/cola_case_closed_hd.png restock-source-assets/
          cp public/assets/game/production-v2/cooler-restock/cola_bottle_hd.png restock-source-assets/
          cp public/assets/game/production-v1/characters/worker/worker-idle.png restock-source-assets/
          cp public/assets/game/production-v1/characters/worker/worker-stock-shelf.png restock-source-assets/
          cp public/assets/game/production-v1/characters/worker/worker-open-box.png restock-source-assets/
          cp public/assets/game/production-v1/characters/worker/worker-push-cart.png restock-source-assets/
          cp public/assets/game/production-v1/characters/worker/worker-carry-box.png restock-source-assets/

      - name: Upload source asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: restock-source-assets
          path: restock-source-assets
          retention-days: 7

      - name: Publish export run status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Restock Source Export',
              description: 'Source assets exported for local cutting',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
