name: Mature Checkout Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/game/assets/LevelAssetResolver.ts"
      - "src/game/presentation/actors/PlayerNavigationView.ts"
      - "src/game/presentation/checkout/**"
      - "src/game/presentation/scenes/CheckoutMarketScene.ts"
      - "src/game/presentation/visual/**"
      - "src/mobile-playability.css"
      - "scripts/capture-mature-checkout.mjs"
      - "scripts/capture-mature-checkout-mobile.mjs"
      - ".github/workflows/mature-checkout-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify mature checkout desktop
        id: audit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/capture-mature-checkout.mjs

      - name: Verify mature checkout mobile landscape
        id: mobile
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/capture-mature-checkout-mobile.mjs

      - name: Upload checkout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-checkout-audit
          path: |
            ui-audit/mature-checkout
            ui-audit/mature-checkout-mobile
          if-no-files-found: warn
          retention-days: 14

      - name: Publish checkout commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$AUDIT_OUTCOME" = "success" ] && [ "$MOBILE_OUTCOME" = "success" ]; then
            STATE=success
            DESC="L3 checkout desktop + mobile landscape passed"
          else
            STATE=failure
            DESC="mature checkout desktop/mobile browser audit failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Checkout Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce checkout result
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.mobile.outcome }}" = "success"
