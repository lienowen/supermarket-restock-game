name: Apply Case Trim Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-case-trim-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove remaining pallet strip and rebalance case
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/game/presentation/actors/RestockActorView.ts")
          original = path.read_text(encoding="utf-8")
          text = original.replace(
              'const RESTOCK_CASE_SIZE: VisualSize = Object.freeze({ width: 155, height: 125 });',
              'const RESTOCK_CASE_SIZE: VisualSize = Object.freeze({ width: 145, height: 108 });'
          ).replace(
              '        0.3\n      )',
              '        0.42\n      )'
          )
          if text == original:
              raise SystemExit("Expected case sizing and crop patterns were not found")
          path.write_text(text, encoding="utf-8")
      - name: Commit case trim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/presentation/actors/RestockActorView.ts
          git commit -m "fix: remove the remaining pallet strip from the open case"
          git push origin HEAD:main
