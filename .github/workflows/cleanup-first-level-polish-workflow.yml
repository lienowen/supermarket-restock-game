name: Cleanup first-level polish workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-first-level-polish-workflow.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify polished source exists
        run: |
          grep -q "playStockPlacementFeedback" src/game/presentation/actors/RestockActorView.ts
          grep -q "level-checklist-feedback" src/game/presentation/ui/CompactLevelChecklistDom.ts

      - name: Remove one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-first-level-feedback-pass.yml
          git rm -f .github/workflows/cleanup-first-level-polish-workflow.yml
          git commit -m "Remove first-level polish workflows"
          git push origin HEAD:main
