name: Apply first-level feedback polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-first-level-feedback-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused first-level polish
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          actor_path = Path('src/game/presentation/actors/RestockActorView.ts')
          actor = actor_path.read_text()

          field_anchor = '  private readonly usesColaStockPose: boolean;\n'
          if 'private lastPlacedItemCount' not in actor:
              if field_anchor not in actor:
                  raise SystemExit('RestockActorView field anchor not found')
              actor = actor.replace(
                  field_anchor,
                  field_anchor + '  private lastPlacedItemCount = -1;\n',
                  1
              )

          dataset_anchor = '    document.body.dataset.restockLoadVisual = "cart-back-case-cart-front";\n'
          if 'restockFeedback' not in actor:
              if dataset_anchor not in actor:
                  raise SystemExit('RestockActorView dataset anchor not found')
              actor = actor.replace(
                  dataset_anchor,
                  dataset_anchor + '    document.body.dataset.restockFeedback = "item-and-shelf-pulses";\n',
                  1
              )

          stock_anchor = '''      .setDisplaySize(RESTOCK_CASE_SIZE.width, RESTOCK_CASE_SIZE.height)
      .setAngle(-2)
      .setAlpha(Math.max(0.78, 1 - snapshot.stockedRows * 0.03));
'''
          if 'this.playStockPlacementFeedback(snapshot);' not in actor:
              if stock_anchor not in actor:
                  raise SystemExit('RestockActorView stock anchor not found')
              actor = actor.replace(
                  stock_anchor,
                  stock_anchor + '\n    this.playStockPlacementFeedback(snapshot);\n',
                  1
              )

          method_anchor = '  private showCompleteState(): void {\n'
          if 'private playStockPlacementFeedback' not in actor:
              if method_anchor not in actor:
                  raise SystemExit('RestockActorView method anchor not found')
              methods = '''  private playStockPlacementFeedback(snapshot: RestockSceneSnapshot): void {
    const itemCount = this.resolvePlacedItemCount(snapshot);
    if (this.lastPlacedItemCount < 0) {
      this.lastPlacedItemCount = itemCount;
      return;
    }
    if (itemCount <= this.lastPlacedItemCount) return;

    const shelfComplete = itemCount % 3 === 0;
    this.lastPlacedItemCount = itemCount;
    const pulseX = RESTOCK_WORKER_POSITION.x + 58;
    const pulseY = RESTOCK_WORKER_POSITION.y - 116;
    const ring = this.scene.add.circle(pulseX, pulseY, shelfComplete ? 24 : 17, 0xffd95e, 0.12)
      .setStrokeStyle(shelfComplete ? 5 : 3, 0xffd95e, 0.95)
      .setDepth(31);
    const label = this.scene.add.text(
      pulseX,
      pulseY - (shelfComplete ? 38 : 29),
      shelfComplete ? "SHELF COMPLETE" : "+1",
      {
        fontFamily: "Arial, sans-serif",
        fontSize: shelfComplete ? "18px" : "17px",
        fontStyle: "bold",
        color: "#fff1a8",
        stroke: "#10231b",
        strokeThickness: 6,
        align: "center"
      }
    ).setOrigin(0.5).setDepth(32);

    this.scene.tweens.add({
      targets: ring,
      scale: shelfComplete ? 2.2 : 1.65,
      alpha: 0,
      duration: shelfComplete ? 430 : 280,
      ease: "Cubic.Out",
      onComplete: () => ring.destroy()
    });
    this.scene.tweens.add({
      targets: label,
      y: label.y - 18,
      alpha: 0,
      duration: shelfComplete ? 720 : 430,
      delay: shelfComplete ? 120 : 40,
      ease: "Cubic.Out",
      onComplete: () => label.destroy()
    });
    this.scene.tweens.add({
      targets: [this.caseBox, this.cartFront],
      y: "-=6",
      duration: 90,
      yoyo: true,
      ease: "Sine.Out"
    });
  }

  private resolvePlacedItemCount(snapshot: RestockSceneSnapshot): number {
    const values = snapshot as unknown as Record<string, unknown>;
    const totalKeys = [
      "stockedItems",
      "stockedProducts",
      "stockedCount",
      "placedItems",
      "placedCount",
      "totalStockedItems",
      "stockedBottles"
    ];
    for (const key of totalKeys) {
      const value = values[key];
      if (typeof value === "number" && Number.isFinite(value)) return Math.max(0, value);
    }

    const currentShelfKeys = [
      "currentShelfItems",
      "currentShelfCount",
      "currentShelfProgress",
      "activeShelfItems",
      "shelfItemCount"
    ];
    for (const key of currentShelfKeys) {
      const value = values[key];
      if (typeof value === "number" && Number.isFinite(value)) {
        return snapshot.stockedRows * 3 + Phaser.Math.Clamp(value, 0, 3);
      }
    }
    return snapshot.stockedRows * 3;
  }

'''
              actor = actor.replace(method_anchor, methods + method_anchor, 1)

          actor_path.write_text(actor)

          checklist_path = Path('src/game/presentation/ui/CompactLevelChecklistDom.ts')
          checklist = checklist_path.read_text()

          append_anchor = '''  document.body.appendChild(root);
  document.body.dataset.levelChecklist = "active";
'''
          if 'level-checklist-feedback' not in checklist:
              if append_anchor not in checklist:
                  raise SystemExit('Checklist append anchor not found')
              feedback_setup = '''  document.body.appendChild(root);
  document.body.dataset.levelChecklist = "active";

  const feedback = document.createElement("div");
  feedback.id = "level-checklist-feedback";
  feedback.setAttribute("aria-hidden", "true");
  applyStyles(feedback, {
    position: "fixed",
    zIndex: "9010",
    padding: "8px 14px",
    border: "2px solid rgba(255, 217, 94, 0.86)",
    borderRadius: "999px",
    background: "rgba(10, 31, 22, 0.94)",
    boxShadow: "0 10px 28px rgba(0, 0, 0, 0.34)",
    color: "#fff1aa",
    fontFamily: "Arial, sans-serif",
    fontSize: "13px",
    fontWeight: "900",
    letterSpacing: "0.7px",
    opacity: "0",
    pointerEvents: "none",
    transform: "translate(-50%, -35%) scale(0.92)",
    transition: "opacity 120ms ease, transform 180ms ease"
  });
  document.body.appendChild(feedback);
'''
              checklist = checklist.replace(append_anchor, feedback_setup, 1)

          position_anchor = '''    root.style.maxHeight = `${Math.max(120, Math.round(bounds.bottom - top - 12))}px`;
  }
'''
          if 'feedback.style.left' not in checklist:
              if position_anchor not in checklist:
                  raise SystemExit('Checklist position anchor not found')
              checklist = checklist.replace(
                  position_anchor,
                  '''    root.style.maxHeight = `${Math.max(120, Math.round(bounds.bottom - top - 12))}px`;
    feedback.style.left = `${Math.round(bounds.left + bounds.width * 0.5)}px`;
    feedback.style.top = `${Math.round(bounds.top + bounds.height * 0.77)}px`;
  }
''',
                  1
              )

          timer_anchor = '  let completionTimer: number | undefined;\n'
          if 'feedbackTimer' not in checklist:
              if timer_anchor not in checklist:
                  raise SystemExit('Checklist timer anchor not found')
              checklist = checklist.replace(
                  timer_anchor,
                  timer_anchor + '  let feedbackTimer: number | undefined;\n',
                  1
              )

          render_anchor = '''    const activeStep = config.checklist.steps[activeIndex];
    const nextStep = config.checklist.steps[activeIndex + 1];
'''
          if 'root.dataset.condensed' not in checklist:
              if render_anchor not in checklist:
                  raise SystemExit('Checklist render anchor not found')
              checklist = checklist.replace(
                  render_anchor,
                  '''    const activeStep = config.checklist.steps[activeIndex];
    const nextStep = config.checklist.steps[activeIndex + 1];
    const condensed = activeIndex > 0;
    root.dataset.condensed = condensed ? "true" : "false";
    root.style.padding = condensed ? "10px 12px" : "13px 14px 12px";
    root.style.width = condensed ? "220px" : "250px";
    nextLabel.style.display = condensed ? "none" : "block";
    dots.style.marginTop = condensed ? "7px" : "10px";
''',
                  1
              )

          function_anchor = '  const completeForAction = (action: string): void => {\n'
          if 'const showProgressFeedback' not in checklist:
              if function_anchor not in checklist:
                  raise SystemExit('Checklist function anchor not found')
              function_text = '''  const showProgressFeedback = (value: number, total: number): void => {
    if (feedbackTimer !== undefined) window.clearTimeout(feedbackTimer);
    const finished = total > 0 && value >= total;
    feedback.textContent = finished
      ? "DELIVERY COMPLETE"
      : `SHELF ${Math.max(1, value)}/${Math.max(1, total)} COMPLETE`;
    feedback.style.opacity = "1";
    feedback.style.transform = "translate(-50%, -50%) scale(1)";
    feedbackTimer = window.setTimeout(() => {
      feedback.style.opacity = "0";
      feedback.style.transform = "translate(-50%, -65%) scale(0.96)";
    }, finished ? 1100 : 760);
  };

'''
              checklist = checklist.replace(function_anchor, function_text + function_anchor, 1)

          progress_anchor = '''      progress = event.payload.progress;
      progressTotal = event.payload.total;
'''
          if 'const previousProgress = progress;' not in checklist:
              if progress_anchor not in checklist:
                  raise SystemExit('Checklist progress anchor not found')
              checklist = checklist.replace(
                  progress_anchor,
                  '''      const previousProgress = progress;
      progress = event.payload.progress;
      progressTotal = event.payload.total;
      if (progress > previousProgress) showProgressFeedback(progress, progressTotal);
''',
                  1
              )

          destroy_anchor = '      if (completionTimer !== undefined) window.clearTimeout(completionTimer);\n'
          if 'window.clearTimeout(feedbackTimer)' not in checklist:
              if destroy_anchor not in checklist:
                  raise SystemExit('Checklist destroy anchor not found')
              checklist = checklist.replace(
                  destroy_anchor,
                  destroy_anchor + '      if (feedbackTimer !== undefined) window.clearTimeout(feedbackTimer);\n',
                  1
              )
          remove_anchor = '      root.remove();\n'
          if 'feedback.remove();' not in checklist:
              if remove_anchor not in checklist:
                  raise SystemExit('Checklist remove anchor not found')
              checklist = checklist.replace(remove_anchor, remove_anchor + '      feedback.remove();\n', 1)

          checklist_path.write_text(checklist)
          PY

      - name: Validate changes
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit polished interaction feedback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/presentation/actors/RestockActorView.ts src/game/presentation/ui/CompactLevelChecklistDom.ts
          git commit -m "Polish first-level interaction feedback"
          git push origin HEAD:main
