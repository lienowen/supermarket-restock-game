name: Mature Level 10 Audit

on:
  pull_request:
    paths:
      - "src/game/application/RestockRushController.ts"
      - "src/game/content/GameContent.ts"
      - "src/game/content/experience/LevelExperienceSpec.ts"
      - "src/game/content/levels/starterMarketLevels.ts"
      - "src/game/presentation/scenes/StarterMarketScene.ts"
      - "src/game/presentation/ui/RestockMemoryPreviewDom.ts"
      - "src/game/presentation/ui/RestockRushMeter.ts"
      - "scripts/capture-final-memory-rush.mjs"
      - "scripts/capture-final-memory-rush-mobile.mjs"
      - ".github/workflows/mature-level-10-audit.yml"
  push:
    branches:
      - main
    paths:
      - "src/game/application/RestockRushController.ts"
      - "src/game/content/GameContent.ts"
      - "src/game/content/experience/LevelExperienceSpec.ts"
      - "src/game/content/levels/starterMarketLevels.ts"
      - "src/game/presentation/scenes/StarterMarketScene.ts"
      - "src/game/presentation/ui/RestockMemoryPreviewDom.ts"
      - "src/game/presentation/ui/RestockRushMeter.ts"
      - "scripts/capture-final-memory-rush.mjs"
      - "scripts/capture-final-memory-rush-mobile.mjs"
      - ".github/workflows/mature-level-10-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  level10:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify Level 10 desktop integrated rush finale
        id: desktop
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/capture-final-memory-rush.mjs

      - name: Verify Level 10 Android software-landscape finale
        id: mobile
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/capture-final-memory-rush-mobile.mjs

      - name: Upload Level 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-level-10-audit
          path: |
            ui-audit/mature-level-10
            ui-audit/mature-level-10-mobile
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Level 10 commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$DESKTOP_OUTCOME" = "success" ] && [ "$MOBILE_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Level 10 integrated rush desktop/Android flow passed"
          else
            STATE=failure
            DESC="mature Level 10 integrated-rush audit failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="Mature Level 10 Audit" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Level 10 result
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.desktop.outcome }}" = "success"
          test "${{ steps.mobile.outcome }}" = "success"
